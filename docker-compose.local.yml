version: "3.8"

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bookshelf_idp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookshelf.ro
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    networks:
      - db-net
    depends_on:
      - postgres

  database-service:
    image: adacosma/database-service:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
    networks:
      - backend-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    image: adacosma/auth-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
    networks:
      - backend-net
    depends_on:
      - database-service

  library-service:
    image: adacosma/library-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    networks:
      - backend-net
    depends_on:
      - database-service

  notification-service:
    image: adacosma/notification-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
    networks:
      - backend-net
    depends_on:
      - database-service

  react-frontend:
    image: adacosma/react-frontend:latest
    ports:
      - "5173:80"
    networks:
      - frontend-net

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - auth-service
      - library-service
      - notification-service

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - management-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
      - backend-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring-net

volumes:
  postgres_data:
  portainer_data:
  prometheus_data:
  grafana_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  db-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  management-net:
    driver: bridge
