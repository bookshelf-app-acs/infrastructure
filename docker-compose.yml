version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bookshelf_idp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookshelf.ro
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - db-net
    depends_on:
      - postgres

  database-service:
    image: adacosma/database-service:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
    networks:
      - backend-net
      - db-net
    depends_on:
      - postgres
    ports:
      - "8083:8083"

  auth-service:
    image: adacosma/auth-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
    networks:
      - backend-net
    depends_on:
      - database-service
    ports:
      - "8081:8081"

  library-service:
    image: adacosma/library-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    networks:
      - backend-net
    depends_on:
      - database-service
    ports:
      - "8082:8082"

  notification-service:
    image: adacosma/notification-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
    networks:
      - backend-net
    depends_on:
      - database-service
    ports:
      - "8084:8084"

  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong:/usr/local/kong/declarative
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - auth-service
      - library-service
      - notification-service

  react-frontend:
    image: adacosma/react-frontend:latest
    ports:
      - "5173:80"
    networks:
      - frontend-net
    depends_on:
      - kong

volumes:
  postgres_data:

networks:
  frontend-net:
  backend-net:
  db-net:
  monitoring-net: