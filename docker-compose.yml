version: "3.8"

# ============================================================
# DOCKER SWARM STACK — docker stack deploy -c docker-compose.yml bookshelf
# Cluster: 1 manager + 2 workers
# - Manager: DB, monitoring, Kong, Portainer, pgAdmin
# - Workers: backend microservices + frontend (replicas: 2 distribuite)
# ============================================================

services:

  # ─── DATABASE TIER (manager) ──────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: bookshelf_idp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bookshelf.ro
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - db-net
    depends_on:
      - postgres
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  database-service:
    image: adacosma/database-service:latest
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASS: postgres
    networks:
      - backend-net
      - db-net
    depends_on:
      - postgres
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ─── BUSINESS MICROSERVICES (workers, distribuite cu replicas: 2) ──
  auth-service:
    image: adacosma/auth-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
    networks:
      - backend-net
    depends_on:
      - database-service
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  library-service:
    image: adacosma/library-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    networks:
      - backend-net
    depends_on:
      - database-service
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  notification-service:
    image: adacosma/notification-service:latest
    environment:
      DATABASE_SERVICE_URL: http://database-service:8083
    networks:
      - backend-net
    depends_on:
      - database-service
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  # ─── FRONTEND (workers) ───────────────────────────────────
  react-frontend:
    image: adacosma/react-frontend:latest
    ports:
      - "5173:80"
    networks:
      - frontend-net
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  # ─── API GATEWAY (manager) ────────────────────────────────
  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    configs:
      - source: kong_config
        target: /usr/local/kong/declarative/kong.yml
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - frontend-net
      - backend-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # ─── MANAGEMENT (manager) ─────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - management-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  # ─── MONITORING (manager) ─────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
      - frontend-net
      - backend-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

configs:
  kong_config:
    file: ./kong/kong.yml

volumes:
  postgres_data:
  portainer_data:
  prometheus_data:
  grafana_data:

# ─── NETWORKS (separare logică microservicii) ──────────────
networks:
  frontend-net:
    driver: overlay
    attachable: true
  backend-net:
    driver: overlay
    attachable: true
  db-net:
    driver: overlay
    attachable: true
  monitoring-net:
    driver: overlay
    attachable: true
  management-net:
    driver: overlay
    attachable: true
