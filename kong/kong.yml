_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true

  - name: library-service
    url: http://library-service:8082
    routes:
      - name: library-route
        paths:
          - /library
        strip_path: true

  - name: notification-service
    url: http://notification-service:8084
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "http://localhost:5174"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      credentials: true
      preflight_continue: false
      max_age: 3600

  - name: prometheus