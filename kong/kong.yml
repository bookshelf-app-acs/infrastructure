_format_version: "2.1"

services:
  - name: auth-service
    url: http://auth-service:8081
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true

  - name: library-service
    url: http://library-service:8082
    routes:
      - name: library-route
        paths:
          - /library
        strip_path: true

  - name: notification-service
    url: http://notification-service:8084
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      credentials: true